context:
  version: "0.1.18"

package:
  name: paks
  version: ${{ version }}

source:
  url: https://github.com/stakpak/paks/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9f40e6b3197eaf1867579704ec9af95e583d7086948da12adeff911b2374bc17

build:
  number: 1
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: ${{ "1" if win else "0" }} # force CMake builder for `aws-lc-sys` native C/C++ code on Windows
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cd apps/cli
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell
    - if: win
      then: cmake

tests:
  - script:
      - paks --help
      - paks --version
  - package_contents:
      bin:
        - paks
      strict: true

about:
  summary: The package manager for AI Agent Skills
  description: |
    Paks is a CLI tool for managing [Agent Skills](https://agentskills.io).
    It helps you create new skills with proper structure, install skills from
    registries or Git repositories, publish skills to share with others, and manage
    installed skills across different AI coding agents.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://paks.stakpak.dev/
  repository: https://github.com/stakpak/paks

extra:
  recipe-maintainers:
    - salim-b
